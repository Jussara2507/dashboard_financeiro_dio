<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Sales Report | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 600; color: var(--text-main); }
        .subtitle { font-size: 14px; color: var(--text-muted); }
        .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
        .kpi-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .kpi-value { font-size: 24px; font-weight: 700; color: var(--accent); }
        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
        .chart-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; height: 350px; position: relative; }
        .chart-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Executive Sales Report</h1>
            <p class="subtitle">Análise Financeira e de Desempenho Comercial</p>
        </div>
    </header>

    <div class="kpi-container">
        <div class="kpi-card">
            <div class="kpi-title">Vendas Brutas Totais</div>
            <div class="kpi-value" id="kpi-sales">$ 118.7M</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Lucro Líquido</div>
            <div class="kpi-value" id="kpi-profit">$ 16.89M</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Unidades Vendidas</div>
            <div class="kpi-value" id="kpi-units">1.1M</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Margem Média</div>
            <div class="kpi-value">14.2%</div>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-card">
            <div class="chart-title">Desempenho de Vendas por Produto</div>
            <canvas id="productChart"></canvas>
        </div>
        <div class="chart-card">
            <div class="chart-title">Distribuição por Segmento</div>
            <canvas id="segmentChart"></canvas>
        </div>
    </div>

    <script>
        const ctxProduct = document.getElementById('productChart').getContext('2d');
        new Chart(ctxProduct, {
            type: 'bar',
            data: {
                labels: ['Paseo', 'VTT', 'Velo', 'Amarilla', 'Montana', 'Carretera'],
                datasets: [{
                    label: 'Vendas ($)',
                    data: [33500000, 21000000, 18500000, 16000000, 15000000, 14700000],
                    backgroundColor: '#f59e0b',
                    borderRadius: 4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        const ctxSegment = document.getElementById('segmentChart').getContext('2d');
        new Chart(ctxSegment, {
            type: 'doughnut',
            data: {
                labels: ['Government', 'Midmarket', 'Channel Partners', 'Enterprise', 'Small Business'],
                datasets: [{
                    data: [45, 20, 15, 12, 8],
                    backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    </script>
</body>
</html>
